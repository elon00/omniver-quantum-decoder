name: CI

on:
  push:
    branches: [ main, master, anna-hackathon-production-fix ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Reality guard
        run: npm run reality:guard
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run NIST PQC Tests
        run: npm run test:nist
      - name: Run Cryptographic Security Audit
        run: npm run audit:crypto
      - name: Run Universal Reality Verification
        run: npm run reality:universal
      - name: One-click full verification summary
        run: |
          echo "Lint, build, NIST PQC tests, crypto audit and internal reality gates passed."
          echo "External verification and live settlement remain evidence-gated and are not fabricated by CI."

  anna-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Anna CLI
        run: npm install -g @anna-ai/cli
      - name: Validate Anna project
        run: anna-app validate --strict
      - name: Compile Executa Python
        run: python -m py_compile executas/omniver-quantum-decoder/omniver_quantum_decoder.py
